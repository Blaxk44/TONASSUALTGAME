events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Firebase CSP
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' 
                https://telegram.org 
                https://cdn.tgads.space 
                https://richinfo.co 
                https://www.gstatic.com 
                https://*.firebaseio.com 
                https://*.googleapis.com;
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            img-src 'self' data: blob: https:;
            font-src 'self' https://fonts.gstatic.com;
            connect-src 'self' 
                https://*.firebaseio.com 
                https://*.googleapis.com 
                https://identitytoolkit.googleapis.com 
                https://securetoken.googleapis.com 
                wss://*.firebaseio.com;
            frame-src 'self' https://*.firebaseapp.com;
            media-src 'self' data: https:;
        " always;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|mp3|wav|ogg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # SPA routing - redirect all to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Admin panel
        location = /admin {
            return 301 /admin-panel.html;
        }
        
        location = /admin-panel.html {
            # Optional: Add basic auth for admin
            # auth_basic "Admin Area";
            # auth_basic_user_file /etc/nginx/.htpasswd;
        }
        
        # API endpoints for serverless functions
        location /api/ {
            # If you add backend later
            proxy_pass http://localhost:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # robots.txt
        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nAllow: /\nSitemap: https://$host/sitemap.xml\n";
        }
    }
}