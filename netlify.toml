[build]
  publish = "."
  command = ""
  
[build.environment]
  NODE_ENV = "production"
  # Firebase config as environment variables
  FIREBASE_API_KEY = "AIzaSyBOETGieVSUrO9Bx52Eml3Kf0kAXYKiP1c"
  FIREBASE_AUTH_DOMAIN = "ton-assault-game.firebaseapp.com"
  FIREBASE_PROJECT_ID = "ton-assault-game"
  FIREBASE_STORAGE_BUCKET = "ton-assault-game.firebasestorage.app"
  FIREBASE_MESSAGING_SENDER_ID = "879983779292"
  FIREBASE_APP_ID = "1:879983779292:web:bd0dc7c28d02b145af4319"

# Security headers for Firebase
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Firebase-friendly CSP
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' 
        https://telegram.org 
        https://cdn.tgads.space 
        https://richinfo.co 
        https://www.gstatic.com 
        https://*.firebaseio.com 
        https://*.googleapis.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: blob: https:;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' 
        https://*.firebaseio.com 
        https://*.googleapis.com 
        https://identitytoolkit.googleapis.com 
        https://securetoken.googleapis.com 
        wss://*.firebaseio.com;
      frame-src 'self' https://*.firebaseapp.com;
      media-src 'self' data: https:;
    """

# SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Admin panel route
[[redirects]]
  from = "/admin"
  to = "/admin-panel.html"
  status = 200

# Game assets cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Functions directory
[functions]
  directory = "netlify/functions"
  
# Edge functions (optional)
[[edge_functions]]
  function = "auth"
  path = "/api/*"